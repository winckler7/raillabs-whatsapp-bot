<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RailLabs · Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body class="login-body">
    <form class="login-card" method="post">
        <h1>RailLabs</h1>
        <p class="login-subtitle">Panel de conversaciones</p>
        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
        <input type="text" name="usuario" placeholder="Usuario" autofocus required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
