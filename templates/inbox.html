<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RailLabs · Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-header">
                <select id="selector-cuenta"></select>
                <form action="{{ url_for('panel.logout') }}" method="post">
                    <button type="submit" id="btn-logout" title="Cerrar sesión">⎋</button>
                </form>
            </div>
            <div id="tabs-buzon">
                <button class="tab-buzon activo" data-buzon="bandeja">Bandeja</button>
                <button class="tab-buzon" data-buzon="archivadas">Archivadas</button>
            </div>
            <div id="filtro-etiquetas"></div>
            <div id="buscador-wrap">
                <input type="text" id="buscador" placeholder="Buscar por nombre o número">
            </div>
            <ul id="lista-conversaciones"></ul>
        </aside>

        <main id="panel-derecho">
            <div id="vacio" class="vacio">Selecciona una conversación</div>

            <div id="hilo" class="oculto">
                <header id="hilo-header">
                    <div id="contacto-info">
                        <span id="contacto-nombre-wrap">
                            <span id="contacto-nombre"></span>
                            <input type="text" id="contacto-nombre-input" class="oculto" placeholder="Nombre del contacto">
                            <button id="btn-editar-nombre" title="Editar nombre">✎</button>
                        </span>
                        <span id="contacto-detalle"></span>
                        <div id="etiquetas-conversacion"></div>
                    </div>
                    <div id="controles">
                        <select id="selector-estado">
                            <option value="abierta">Abierta</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="resuelta">Resuelta</option>
                        </select>
                        <button id="btn-modo"></button>
                        <button id="btn-etiquetas-toggle" title="Etiquetas">🏷</button>
                        <button id="btn-notas-toggle" title="Notas">Notas</button>
                        <button id="btn-archivar" title="Archivar"></button>
                    </div>
                </header>

                <div id="panel-etiquetas" class="oculto">
                    <div id="etiquetas-chips"></div>
                    <button id="btn-nueva-etiqueta" type="button">+ Nueva etiqueta</button>
                </div>

                <div id="panel-notas" class="oculto">
                    <textarea id="notas" placeholder="Notas internas..."></textarea>
                    <button id="btn-guardar-notas">Guardar notas</button>
                </div>

                <div id="mensajes"></div>

                <div id="plantillas-chips"></div>

                <form id="form-responder">
                    <button type="button" id="btn-adjuntar" title="Adjuntar archivo">📎</button>
                    <input type="file" id="input-archivo" class="oculto" accept="image/*,audio/*,video/*,application/pdf">
                    <textarea id="texto-respuesta" placeholder="Escribe un mensaje" rows="1"></textarea>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='panel.js') }}"></script>
</body>
</html>
